name: Supplement Price Monitor

on:
  schedule:
    - cron: "0 9 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-price:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check product price
        id: check_price
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor.py

      - name: Save price history
        if: steps.check_price.outcome == 'success'
        run: |
          git config user.name "Price Monitor Bot"
          git config user.email "actions@github.com"

          git add price_history.json

          if git diff --cached --quiet; then
            echo "No price change to commit."
          else
            git commit -m "Update price history"
          fi

          git pull --rebase origin main
          git push origin main

      - name: Notify price monitor failure
        if: failure() && steps.check_price.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="⚠️ PRICE MONITOR FAILED

          Core Champs L-Carnitine price could not be retrieved.

          The scraper may need attention.

          GitHub workflow:
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="$MESSAGE"
